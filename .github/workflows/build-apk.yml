name: Paw Assistant Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Debug APK Derle
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v4

      - name: Android SDK Platform 36 Kurulumu
        run: sdkmanager "platforms;android-36"

      - name: Gradle 9.5.0 Kurulumu
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Debug APK Derle
        run: gradle :app:assembleDebug --no-daemon

      - name: Debug APK Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: paw-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
